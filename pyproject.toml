[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web-scraper"
version = "1.0.0"
description = "Configurable, target-driven web scraping for macOS: describe the records you need and get a clean, de-duplicated dataset."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.25",
    "beautifulsoup4>=4.11",
    "lxml>=4.9",
    "openpyxl>=3.1",
    "phonenumbers>=8.13",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
parquet = ["pyarrow>=12"]
dev = ["pytest>=7"]

[project.scripts]
webscraper = "webscraper.cli:main"

[tool.setuptools.packages.find]
include = ["webscraper*"]

[tool.setuptools.package-data]
"webscraper.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
